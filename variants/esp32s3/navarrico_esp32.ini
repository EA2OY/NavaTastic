; =====================================================================
; NAVARICO - ENVS ESP32-S3 (Heltec V3 / V4) — PORT 29/08/2026
; =====================================================================
; Port del fork a las placas ESP32-S3 Heltec V3 (8MB) y V4 (16MB, OLED).
; NavaCLI, seguridad, proteccion de Flash, auto-favoritos, anti-storm y
; protocolo del panico son codigo compartido (src/) y entran tal cual.
; NO aplican: LPCOMP/energia nRF52 (la gestion de bateria es la de
; Meshtastic stock para ESP32; set_chem/set_vbat/set_vwake y storm quedan
; con comportamiento de plataforma o deshabilitados).
; Compilar SOLO con -e explicito (fuera de default_envs).
; =====================================================================

[env:navarrico_heltec_v3_sx1262_r2ig]
extends = env:heltec-v3
custom_meshtastic_app_env = heltec-v3
custom_meshtastic_prefs = profiles/R2IG_HeltecV3.jsonc
build_flags = ${env:heltec-v3.build_flags}
  -DNAVARICO_RADIO_SX1262
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1

[env:navarrico_heltec_v3_sx1262_r1ig]
extends = env:heltec-v3
custom_meshtastic_app_env = heltec-v3
custom_meshtastic_prefs = profiles/R1IG_HeltecV3.jsonc
build_flags = ${env:heltec-v3.build_flags}
  -DNAVARICO_RADIO_SX1262
  -DNAVARICO_RAMA_1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1

[env:navarrico_heltec_v4_sx1262_r2ig]
extends = env:heltec-v4
custom_meshtastic_app_env = heltec-v4
custom_meshtastic_prefs = profiles/R2IG_HeltecV4.jsonc
build_flags = ${env:heltec-v4.build_flags}
  -DNAVARICO_RADIO_SX1262
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1

[env:navarrico_heltec_v4_sx1262_r1ig]
extends = env:heltec-v4
custom_meshtastic_app_env = heltec-v4
custom_meshtastic_prefs = profiles/R1IG_HeltecV4.jsonc
build_flags = ${env:heltec-v4.build_flags}
  -DNAVARICO_RADIO_SX1262
  -DNAVARICO_RAMA_1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
