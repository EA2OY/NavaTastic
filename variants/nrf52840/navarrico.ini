; =====================================================================
; NAVARICO - ENVS UNIFICADOS (12 compilaciones desde un solo repositorio)
; =====================================================================
; COMO ELEGIR VERSION (VS Code / PlatformIO desplegable, o CLI):
;   pio run -e navarrico_promicro_e22p_r2ig
;
; Formato del nombre del env: navarrico_<placa>_<radio>_<rama>
;   placa_radio:
;     promicro_e22p    -> nRF52840 Pro Micro + modulo E22P        (12 dBm, pin de alimentacion P0.17)
;     faketec_sx1262   -> nRF52840 Pro Micro + modulo HT-RA62     (22 dBm, RXEN P0.17)
;     seed_sx1262      -> Seeed Solar Node P1 (SX1262)            (22 dBm)
;     t114_sx1262      -> Heltec T114 (SX1262)                    (22 dBm)
;     xiao_kit_sx1262  -> Xiao nRF52840 Kit + radio original      (22 dBm)
;     xiao_e22p        -> Xiao nRF52840 Kit + modulo E22P         (12 dBm, pin de alimentacion D5)
;   rama:
;     r2ig -> Rama 2 Routers, Infraestructura GENERAL (clave admin Master Node, BT 654321)
;     r1ig -> Rama 1 Clientes, Infraestructura GENERAL (rol CLIENT, clave Master Node, BT 654321)
;     (a futuro: r2ip/r1ip = Infraestructura PROPIA -> añadir su perfil en profiles/ y 2 envs aqui,
;      SIN tocar codigo: las macros NAVARICO_RADIO_* y NAVARICO_RAMA_1 ya lo soportan)
;
; MECANICA:
;   - custom_meshtastic_app_env: el binario reporta el APP_ENV canonico de la placa (identico al
;     build original de los 24 repos viejos), aunque el env se llame distinto.
;   - custom_meshtastic_prefs: perfil con claves admin, canal Navadmin, rol y BT (profiles/).
;   - NAVARICO_RADIO_E22P / NAVARICO_RADIO_SX1262: eligen la rama del variant.h fusionado
;     (potencia maxima, pin de radio, curva OCV) y el rango de /nava set_txpower.
;   - NAVARICO_RAMA_1: solo en Rama 1 - rol CLIENT por defecto + rol semi-permanente en /resilience.bin.
; =====================================================================

[env:navarrico_promicro_e22p_r2ig]
extends = env:nrf52_promicro_diy_tcxo
custom_meshtastic_app_env = nrf52_promicro_diy_tcxo
custom_meshtastic_prefs = profiles/R2IG_Promicro.jsonc
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_E22P

[env:navarrico_faketec_sx1262_r2ig]
extends = env:nrf52_promicro_diy_tcxo
custom_meshtastic_app_env = nrf52_promicro_diy_tcxo
custom_meshtastic_prefs = profiles/R2IG_Faketec.jsonc
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_SX1262

[env:navarrico_seed_sx1262_r2ig]
